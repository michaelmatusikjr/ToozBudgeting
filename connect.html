<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>ToozBudgeting · Connect your bank</title>
  <style>
    body{font:16px/1.5 system-ui,-apple-system,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f3ee;color:#1d2327}
    main{max-width:24rem;width:100%;box-sizing:border-box;padding:1.5rem 1.25rem;text-align:center}
    h1{font-size:1.35rem;margin:.25rem 0 .5rem}
    p{margin:.5rem 0}
    .muted{color:#5b6670;font-size:.92rem}
    .err{color:#a1362b}
    .code{font:600 .8rem ui-monospace,Menlo,monospace;color:#5b6670}
    .btn{display:block;width:100%;box-sizing:border-box;margin:.75rem 0 0;padding:.85rem 1rem;border-radius:999px;border:0;background:#1f6f5c;color:#fff;font:600 1rem system-ui,sans-serif;text-decoration:none}
    .btn.ghost{background:#e8e1d6;color:#1d2327}
    .gsi-host{display:flex;justify-content:center;margin:.75rem 0}
    .gsi-link{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:44px;padding:0 20px;border:1px solid #dadce0;border-radius:999px;background:#fff;color:#1f1f1f;font:500 15px/1 system-ui,sans-serif;text-decoration:none;width:100%;max-width:360px;box-sizing:border-box}
  </style>
</head>
<body>
  <main>
    <p class="muted">ToozBudgeting</p>
    <h1 id="title">Connect your bank</h1>
    <p id="msg">One moment.</p>
    <div id="extra"></div>
    <a class="btn ghost" id="back" href="./">Back to ToozBudgeting</a>
    <p class="code" id="code"></p>
    <p class="code" id="ver"></p>
  </main>
  <noscript><p>Turn on JavaScript to connect your bank.</p></noscript>
  <script>
    // If the module below can't load at all, never leave a blank page.
    window.__oauthStarted = false;
    setTimeout(function () {
      if (window.__oauthStarted) return;
      document.getElementById("title").textContent = "Couldn’t finish here";
      document.getElementById("msg").textContent = "This page didn’t load completely. Check your connection, then go back to ToozBudgeting and connect the bank again.";
      document.getElementById("code").textContent = "OAUTH_SCRIPT_LOAD";
    }, 12000);
  </script>
  <script type="module" src="./js/connect.js?v=154"></script>
</body>
</html>
